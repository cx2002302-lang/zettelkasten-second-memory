version: "3.9"
#
# 兼容测试环境 Compose 定义
#
# 注意：当前主机上的 docker-compose v1 (1.29.2) 与新版 Docker API 不兼容，
# 会抛出 KeyError: 'ContainerConfig'。因此实际启动请使用：
#   bash scripts/start-container.sh <openclaw-2026-4-23|openclaw-2026-4-24|openclaw-latest|hermes-latest>
#   bash scripts/deploy-zk-to-container.sh <openclaw-...>
#
# 本文件保留作为 docker compose v2 / 新版 docker-compose 的参考配置。
#

services:
  openclaw-2026-4-23:
    container_name: openclaw-2026-4-23
    image: ghcr.io/openclaw/openclaw:2026.4.23
    user: "1000:1000"
    ports:
      - "18890:18789"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - oc-2026-4-23-data:/home/node/.openclaw
      - ../../..:/opt/zettelkasten-source:ro
      - ../../skills/brain:/home/node/.openclaw/skills/zettelkasten-brain:ro
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--allow-unconfigured"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "openclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  openclaw-2026-4-24:
    container_name: openclaw-2026-4-24
    image: ghcr.io/openclaw/openclaw:2026.4.24
    user: "1000:1000"
    ports:
      - "18891:18789"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - oc-2026-4-24-data:/home/node/.openclaw
      - ../../..:/opt/zettelkasten-source:ro
      - ../../skills/brain:/home/node/.openclaw/skills/zettelkasten-brain:ro
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--allow-unconfigured"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "openclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  openclaw-latest:
    container_name: openclaw-latest
    image: ghcr.io/openclaw/openclaw:latest
    user: "1000:1000"
    ports:
      - "18892:18789"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - oc-latest-data:/home/node/.openclaw
      - ../../..:/opt/zettelkasten-source:ro
      - ../../skills/brain:/home/node/.openclaw/skills/zettelkasten-brain:ro
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--allow-unconfigured"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "openclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  hermes-latest:
    container_name: hermes-latest
    image: nousresearch/hermes-agent:latest
    ports:
      - "8652:8642"
      - "9129:9119"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
    volumes:
      - hermes-latest-data:/root/.hermes
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  oc-2026-4-23-data:
  oc-2026-4-24-data:
  oc-latest-data:
  hermes-latest-data:
