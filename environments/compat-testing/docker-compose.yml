# Zettelkasten 兼容性测试环境
#
# 4 个容器服务：
#   openclaw-latest       最新版 OpenClaw（滚动 latest tag）
#   openclaw-prod-mirror  与生产一致的 OpenClaw 2026.4.24
#   hermes-latest         最新版 Hermes Agent
#   hermes-prod-mirror    与生产一致的 Hermes v0.17.0
#
# 敏感配置（API Key 等）统一通过 env_file 从 .env 注入，.env 不提交 Git。
# 日常管理请使用 Makefile：make up / make test / make down / make clean
# 兜底清理：scripts/cleanup-docker.sh（建议 cron 每天 03:00 执行）
#
# Compose 版本说明：优先使用项目内置 bin/docker-compose（v2+ standalone，
# 由 Makefile 自动探测）；主机上的 docker-compose v1 亦可工作，但不保证
# 未来 Docker API 兼容性。

name: compat-testing

services:
  # ---------------------------------------------------------------------------
  # OpenClaw latest（滚动版本，用于提前发现新版本不兼容）
  # ---------------------------------------------------------------------------
  openclaw-latest:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_VERSION: latest
    image: compat-testing/openclaw:latest
    container_name: openclaw-latest
    user: "1000:1000"
    env_file:
      - .env
    ports:
      - "18892:18789"   # gateway
      - "19092:9090"    # MCP
    volumes:
      - oc-latest-data:/home/node/.openclaw
      - ../..:/opt/zettelkasten-source:ro
      - ../../skills/brain:/home/node/.openclaw/skills/zettelkasten-brain:ro
    command: ["node", "openclaw.mjs", "gateway", "--bind", "auto", "--allow-unconfigured"]
    restart: unless-stopped
    labels:
      com.zettelkasten.compat-testing: "true"
    healthcheck:
      test: ["CMD", "openclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - compat-testing

  # ---------------------------------------------------------------------------
  # OpenClaw 生产镜像（与生产环境版本一致，防止部署后崩溃）
  # ---------------------------------------------------------------------------
  openclaw-prod-mirror:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_VERSION: ${OPENCLAW_PROD_VERSION:-2026.4.24}
        OPENCLAW_REGISTRY: ghcr.io/openclaw/openclaw
    image: compat-testing/openclaw:${OPENCLAW_PROD_VERSION:-2026.4.24}
    container_name: openclaw-prod-mirror
    user: "1000:1000"
    env_file:
      - .env
    ports:
      - "18891:18789"   # gateway
      - "19091:9090"    # MCP
    volumes:
      # 复用 2026.4.24 数据卷（已含预置配置 openclaw.json 与已部署插件）
      - oc-2026-4-24-data:/home/node/.openclaw
      - ../..:/opt/zettelkasten-source:ro
      - ../../skills/brain:/home/node/.openclaw/skills/zettelkasten-brain:ro
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--allow-unconfigured"]
    restart: unless-stopped
    labels:
      com.zettelkasten.compat-testing: "true"
    healthcheck:
      test: ["CMD", "openclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - compat-testing

  # ---------------------------------------------------------------------------
  # Hermes latest（滚动版本）
  # ---------------------------------------------------------------------------
  hermes-latest:
    build:
      context: .
      dockerfile: Dockerfile.hermes
      args:
        HERMES_VERSION: latest
    image: compat-testing/hermes:latest
    container_name: hermes-latest
    env_file:
      - .env
    ports:
      - "8652:8642"
      - "9129:9119"
    volumes:
      - hermes-latest-data:/root/.hermes
    # hermes 默认命令是交互式 TUI，无 TTY 会立即退出；
    # 测试环境保持容器存活，通过 docker exec 探测版本与执行测试。
    command: ["sleep", "infinity"]
    restart: unless-stopped
    labels:
      com.zettelkasten.compat-testing: "true"
    healthcheck:
      test: ["CMD-SHELL", "hermes --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - compat-testing

  # ---------------------------------------------------------------------------
  # Hermes 生产镜像（与生产环境一致 v0.17.0）
  # 注：上游 nousresearch/hermes-agent 在 Docker Hub 仅发布 latest tag，
  #     本地通过 make pin-hermes-prod 将已验证的 v0.17.0 镜像固化为
  #     nousresearch/hermes-agent:0.17.0（详见 README「版本固定」）。
  # ---------------------------------------------------------------------------
  hermes-prod-mirror:
    build:
      context: .
      dockerfile: Dockerfile.hermes
      args:
        HERMES_VERSION: ${HERMES_PROD_TAG:-0.17.0}
    image: compat-testing/hermes:${HERMES_PROD_TAG:-0.17.0}
    container_name: hermes-prod-mirror
    env_file:
      - .env
    ports:
      - "8653:8642"
      - "9130:9119"
    volumes:
      - hermes-prod-mirror-data:/root/.hermes
    command: ["sleep", "infinity"]
    restart: unless-stopped
    labels:
      com.zettelkasten.compat-testing: "true"
    healthcheck:
      test: ["CMD-SHELL", "hermes --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - compat-testing

# 与 scripts/start-container.sh 共用的自定义网络（容器名互相解析）。
# external: 由 Makefile / 脚本创建，make down 不会删除它。
networks:
  compat-testing:
    name: compat-testing
    external: true

# 显式命名，复用脚本时代已部署好的数据卷
volumes:
  oc-latest-data:
    name: compat-testing_oc-latest-data
  oc-2026-4-24-data:
    name: compat-testing_oc-2026-4-24-data
  hermes-latest-data:
    name: hermes-latest-data
  hermes-prod-mirror-data:
    name: compat-testing_hermes-prod-mirror-data
